trigger: none

pr:
  autoCancel: true
  paths:
    include:
      - .azure/visual-regression.yaml
      - .azure/pipeline-variables/shared-services.yaml
      - packages/react
      - packages/html/ds
      - packages/angular
      - packages/design
      - packages/themes/govie
      - packages/themes/doete

parameters:
  - name: vmImage
    type: string
    default: ubuntu-24.04
  - name: nodeVersion
    type: string
    default: "24.22.1"
  - name: pnpmVersion
    type: string
    default: "10.33.0"

variables:
  - template: pipeline-variables/shared-services.yaml

resources:
  repositories:
    - repository: pipeline-templates
      type: github
      endpoint: ogcio
      name: ogcio/building-blocks-pipelines
      ref: refs/tags/v1.2.0

stages:
  - stage: Changes
    displayName: Detect Changes
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: Detect
        displayName: Detect Changed Libraries
        steps:
          - checkout: self
            fetchDepth: 2

          - script: |
              set -euo pipefail

              if [ "$(Build.Reason)" = "PullRequest" ]; then
                changed=$(git diff --name-only HEAD^1 HEAD)
              else
                changed=$(git ls-files)
              fi

              shared='^(\.azure/(visual-regression|pipeline-variables/shared-services)\.yaml|packages/design/|packages/themes/govie/)'
              match() { grep -qE "$1" <<< "$changed" && echo true || echo false; }

              echo "##vso[task.setvariable variable=html;isOutput=true]$(match "$shared|^packages/html/ds/")"
              echo "##vso[task.setvariable variable=react;isOutput=true]$(match "$shared|^packages/(react|themes/doete)/")"
              echo "##vso[task.setvariable variable=angular;isOutput=true]$(match "$shared|^packages/angular/")"
            name: paths
            displayName: Detect Changed Paths

  - stage: ChromaticHTML
    displayName: Chromatic for HTML Library
    dependsOn: Changes
    condition: eq(dependencies.Changes.outputs['Detect.paths.html'], 'true')
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: ChromaticDeploy
        displayName: Build and Upload Chromatic
        steps:
          - checkout: self
            displayName: Get Full Git History
            fetchDepth: 0

          - template: tools/install-pnpm.yml@pipeline-templates
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - script: pnpm storybook:build:html
            displayName: Build HTML Storybook

          - script: npx chromatic --config-file packages/html/ds/chromatic.config.json
            displayName: Run Chromatic
            env:
              CHROMATIC_PROJECT_TOKEN: $(CHROMATIC_PROJECT_TOKEN_HTML)

  - stage: BuildReact
    displayName: Build React Storybook
    dependsOn: Changes
    condition: eq(dependencies.Changes.outputs['Detect.paths.react'], 'true')
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: BuildReactStorybook
        displayName: Build React Storybook
        steps:
          - template: tools/install-pnpm.yml@pipeline-templates
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - script: pnpm storybook:build:react
            displayName: Build React Storybook

          - task: PublishPipelineArtifact@1
            displayName: Publish Storybook Static
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/packages/react/storybook-static
              artifact: react_storybook_static
              publishLocation: pipeline

  - stage: ChromaticReact
    displayName: Chromatic for React Library
    dependsOn: BuildReact
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: ChromaticDeploy
        displayName: Upload to Chromatic
        steps:
          - checkout: self
            displayName: Get Full Git History
            fetchDepth: 0

          - template: tools/install-pnpm.yml@pipeline-templates
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - task: DownloadPipelineArtifact@2
            displayName: Download Storybook Static
            inputs:
              buildType: current
              artifactName: react_storybook_static
              targetPath: $(System.DefaultWorkingDirectory)/packages/react/storybook-static

          - script: npx chromatic --config-file packages/react/chromatic.config.json
            displayName: Run Chromatic
            env:
              CHROMATIC_PROJECT_TOKEN: $(CHROMATIC_PROJECT_TOKEN_REACT)

  - stage: Playwright
    displayName: Playwright for React Library
    dependsOn: BuildReact
    jobs:
      - job: PlaywrightTest
        displayName: Run Playwright Tests
        pool:
          vmImage: ${{ parameters.vmImage }}
        container: ${{ variables.playwrightImage }}
        strategy:
          matrix:
            chromium:
              project: chromium
            firefox:
              project: firefox
            webkit:
              project: webkit
            android:
              project: android
            iphone:
              project: iphone
        steps:
          - template: tools/install-pnpm.yml@pipeline-templates
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - task: DownloadPipelineArtifact@2
            displayName: Download Storybook Static
            inputs:
              buildType: current
              artifactName: react_storybook_static
              targetPath: $(System.DefaultWorkingDirectory)/packages/react/storybook-static

          - script: pnpm -C packages/react playwright:test --project=$(project)
            displayName: Run Playwright Tests
            env:
              CI: "true"

          - task: PublishTestResults@2
            displayName: Publish Test Results
            inputs:
              searchFolder: $(System.DefaultWorkingDirectory)/packages/react/test-results
              testResultsFormat: JUnit
              testResultsFiles: results.xml
              testRunTitle: React $(project)
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: Publish Test Results Artifact
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/packages/react/test-results
              artifact: react_$(project)
              publishLocation: pipeline
            condition: succeededOrFailed()

  - stage: BuildAngular
    displayName: Build Angular Storybook
    dependsOn: Changes
    condition: eq(dependencies.Changes.outputs['Detect.paths.angular'], 'true')
    pool:
      vmImage: ${{ parameters.vmImage }}
    jobs:
      - job: BuildAngularStorybook
        displayName: Build Angular Storybook
        steps:
          - template: tools/install-pnpm.yml@pipeline-templates
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - script: pnpm storybook:build:angular
            displayName: Build Angular Storybook

          - task: PublishPipelineArtifact@1
            displayName: Publish Storybook Static
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/packages/angular/storybook-static
              artifact: angular_storybook_static
              publishLocation: pipeline

  - stage: PlaywrightAngular
    displayName: Playwright for Angular Library
    dependsOn: BuildAngular
    jobs:
      - job: PlaywrightTest
        displayName: Run Playwright Tests
        pool:
          vmImage: ${{ parameters.vmImage }}
        container: ${{ variables.playwrightImage }}
        strategy:
          matrix:
            chromium:
              project: chromium
            firefox:
              project: firefox
            webkit:
              project: webkit
            android:
              project: android
            iphone:
              project: iphone
        steps:
          - template: tools/install-pnpm.yml@pipeline-templates
            parameters:
              nodeVersion: ${{ parameters.nodeVersion }}
              pnpmVersion: ${{ parameters.pnpmVersion }}

          - task: DownloadPipelineArtifact@2
            displayName: Download Storybook Static
            inputs:
              buildType: current
              artifactName: angular_storybook_static
              targetPath: $(System.DefaultWorkingDirectory)/packages/angular/storybook-static

          - script: pnpm -C packages/angular playwright:test --project=$(project)
            displayName: Run Playwright Tests
            env:
              CI: "true"

          - task: PublishTestResults@2
            displayName: Publish Test Results
            inputs:
              searchFolder: $(System.DefaultWorkingDirectory)/packages/angular/test-results
              testResultsFormat: JUnit
              testResultsFiles: results.xml
              testRunTitle: Angular $(project)
            condition: succeededOrFailed()

          - task: PublishPipelineArtifact@1
            displayName: Publish Test Results Artifact
            inputs:
              targetPath: $(System.DefaultWorkingDirectory)/packages/angular/test-results
              artifact: angular_$(project)
              publishLocation: pipeline
            condition: succeededOrFailed()
